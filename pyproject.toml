[project]
name = "liam-cache"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pyarrow",
  "pandas",
  "boto3",
  "pyiceberg[sql-sqlite]",
  "redis",
  "datafusion>=48.0.0",
  "sqlparse>=0.5.3",
  "psutil>=7.0.0",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
