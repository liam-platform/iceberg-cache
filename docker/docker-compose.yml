services:
  minio:
    image: minio/minio:latest
    container_name: iceberg-cache-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # One-shot service that creates the required buckets once MinIO is healthy
  minio-init:
    image: minio/mc:latest
    container_name: iceberg-cache-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/iceberg-stress &&
        mc mb --ignore-existing local/warehouse &&
        echo 'MinIO buckets ready'
      "
    restart: "no"

volumes:
  minio_data:
